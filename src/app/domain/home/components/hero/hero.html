<section class="hero" id="hero" aria-labelledby="hero-heading">
  <div class="container">
    <div class="hero-content">
      <p class="hero-subtitle">BRUNO DONATELLI</p>
      <h1 id="hero-heading" class="hero-title">
        Criando experiências digitais incríveis
      </h1>
      <a href="/home#contact" class="hero-cta" aria-label="CONTATO - Ir para formulário de contato">
        CONTATO
      </a>
    </div>

    <div class="hero-visual">
      <div class="hero-mockup">
        <picture>
          <!-- AVIF srcset — MUST match <link rel="preload"> in index.html -->
          <source
            type="image/avif"
            srcset="
              /hero/donatelli-400w.avif 400w,
              /hero/donatelli-600w.avif 600w,
              /hero/donatelli-800w.avif 800w
            "
            sizes="
              (max-width: 768px) 300px,
              (max-width: 1024px) 350px,
              400px
            "
          />

          <!-- Fallback img (must be last) -->
          <img [ngSrc]="photoUrl" alt="Bruno Donatelli - Desenvolvedor Full Stack" class="hero-photo"
            [width]="photoWidth" [height]="photoHeight" fetchpriority="high" decoding="async" loading="eager" />
        </picture>
      </div>
    </div>
  </div>
</section>
