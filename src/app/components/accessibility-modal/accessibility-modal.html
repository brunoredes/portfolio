<dialog id="accessibility-dialog" class="accessibility-dialog" cdkTrapFocus aria-labelledby="dialog-title"
  aria-describedby="dialog-description">
  <div class="dialog-content">
    <header class="dialog-header">
      <h2 id="dialog-title" class="dialog-title">
        Configurações de Acessibilidade
      </h2>
      <p id="dialog-description" class="dialog-description">
        Personalize sua experiência de navegação
      </p>
      <button type="button" class="close-button" (click)="closeDialog()" aria-label="Fechar configurações">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </header>

    <form class="dialog-form" (ngSubmit)="onSubmit($event)">

      <!-- Font Size -->
      <fieldset class="form-section">
        <legend class="section-title">Tamanho da Fonte</legend>
        <div class="radio-group">
          <label class="radio-label" for="fontSizeNormal">
            <input type="radio" id="fontSizeNormal" name="fontSize" value="normal" [(ngModel)]="formData.fontSize" />
            <span>Normal</span>
          </label>
          <label class="radio-label" for="fontSizeLarge">
            <input type="radio" id="fontSizeLarge" name="fontSize" value="large" [(ngModel)]="formData.fontSize" />
            <span>Grande</span>
          </label>
          <label class="radio-label" for="fontSizeXLarge">
            <input type="radio" id="fontSizeXLarge" name="fontSize" value="x-large" [(ngModel)]="formData.fontSize" />
            <span>Muito Grande</span>
          </label>
        </div>
      </fieldset>

      <!-- Visual Options -->
      <fieldset class="form-section">
        <legend class="section-title">Opções Visuais</legend>

        <label class="checkbox-label" for="highContrast">
          <input type="checkbox" id="highContrast" [(ngModel)]="formData.highContrast" name="highContrast" />
          <span class="checkbox-text">
            <strong>Alto Contraste</strong>
            <small>Aumenta o contraste entre texto e fundo</small>
          </span>
        </label>

        <label class="checkbox-label" for="linkUnderlines">
          <input type="checkbox" id="linkUnderlines" [(ngModel)]="formData.linkUnderlines" name="linkUnderlines" />
          <span class="checkbox-text">
            <strong>Sublinhar Links</strong>
            <small>Sempre mostrar sublinhado em links</small>
          </span>
        </label>

        <label class="checkbox-label" for="dyslexiaFont">
          <input type="checkbox" id="dyslexiaFont" [(ngModel)]="formData.dyslexiaFont" name="dyslexiaFont" />
          <span class="checkbox-text">
            <strong>Fonte para Dislexia</strong>
            <small>Usa fonte Poppins mais legível para títulos</small>
          </span>
        </label>
      </fieldset>

      <!-- Motion & Animation -->
      <fieldset class="form-section">
        <legend class="section-title">Movimento e Animação</legend>

        <label class="checkbox-label" for="reducedMotion">
          <input type="checkbox" id="reducedMotion" [(ngModel)]="formData.reducedMotion" name="reducedMotion" />
          <span class="checkbox-text">
            <strong>Reduzir Movimento</strong>
            <small>Desabilita animações e transições</small>
          </span>
        </label>
      </fieldset>

      <!-- Focus Indicators -->
      <fieldset class="form-section">
        <legend class="section-title">Indicadores de Foco</legend>
        <div class="radio-group">
          <label class="radio-label" for="focusIndicatorsDefault">
            <input type="radio" id="focusIndicatorsDefault" name="focusIndicators" value="default"
              [(ngModel)]="formData.focusIndicators" />
            <span>Padrão</span>
          </label>
          <label class="radio-label" for="focusIndicatorsEnhanced">
            <input type="radio" id="focusIndicatorsEnhanced" name="focusIndicators" value="enhanced"
              [(ngModel)]="formData.focusIndicators" />
            <span>Aprimorado</span>
          </label>
        </div>
      </fieldset>

      <!-- Color Scheme -->
      <fieldset class="form-section">
        <legend class="section-title">Esquema de Cores</legend>
        <div class="select-wrapper">
          <select id="colorScheme" [(ngModel)]="formData.colorScheme" name="colorScheme" class="select-input">
            <option value="default">Padrão</option>
            <option value="monochrome">Monocromático</option>
            <option value="deuteranopia">Deuteranopia (Dificuldade com verde)</option>
            <option value="protanopia">Protanopia (Dificuldade com vermelho)</option>
          </select>
        </div>
        <p class="color-scheme-note">
          <small>
            <strong>Deuteranopia:</strong> Daltonismo vermelho-verde (mais comum)<br>
            <strong>Protanopia:</strong> Deficiência na percepção de vermelho
          </small>
        </p>
      </fieldset>

      <!-- Actions -->
      <footer class="dialog-footer">
        <button type="button" class="button button-secondary" (click)="onReset()"
          aria-label="Restaurar configurações para os padrões">
          Restaurar Padrões
        </button>
        <div class="button-group">
          <button type="button" class="button button-ghost" (click)="onCancel()"
            aria-label="Cancelar alterações e fechar configurações">
            Cancelar
          </button>
          <button type="submit" class="button button-primary"
            aria-label="Salvar alterações de acessibilidade e fechar configurações">
            Salvar Alterações
          </button>
        </div>
      </footer>
    </form>
  </div>
</dialog>
