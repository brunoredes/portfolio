<section class="hero" id="hero" aria-labelledby="hero-heading">
  <div class="container">
    <div class="hero-content">
      <p class="hero-subtitle">BRUNO DONATELLI</p>
      <h1 id="hero-heading" class="hero-title">
        Criando experiências digitais incríveis
      </h1>
      <a href="#contact" class="hero-cta" aria-label="CONTATO - Ir para formulário de contato">
        CONTATO
      </a>
    </div>

    <div class="hero-visual">
      <div class="hero-mockup">
        <img [ngSrc]="photoUrl" [alt]="'Bruno Donatelli - Desenvolvedor Full Stack'" [width]="photoWidth"
          [height]="photoHeight" class="hero-photo" priority [placeholder]="'blur'" />
      </div>
    </div>
  </div>
</section>
