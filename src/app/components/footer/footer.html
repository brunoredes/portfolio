<footer class="footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-brand">
        <div class="footer-logo">
          <span class="logo-text">BRUNO DONATELLI</span>
        </div>
        <p class="footer-tagline">
          Desenvolvedor Full Stack
        </p>
      </div>

      <nav class="footer-nav" aria-label="Footer navigation">
        <h3 class="footer-nav-title">Navegação</h3>
        <ul class="footer-nav-list">
          @for (link of navLinks; track link.id) {
          <li class="footer-nav-item">
            <a [href]="link.href" class="footer-nav-link">
              {{ link.label }}
            </a>
          </li>
          }
        </ul>
      </nav>

      <div class="footer-social">
        <h3 class="footer-social-title">onde me encontrar</h3>
        <div class="social-links">
          @for (social of socialLinks; track social.id) {
          <a [href]="social.url" [attr.aria-label]="social.label" class="social-link" target="_blank"
            rel="noopener noreferrer">
            <img [src]="'/assets/icons/' + social.icon + '.svg'" [alt]="social.label + ' icon'" class="social-icon"
              width="24" height="24" />
          </a>
          }
        </div>
      </div>
    </div>

    <div class="footer-bottom">
      <p class="footer-copyright">
        {{ currentYear }} - ALL RIGHTS RESERVED
      </p>
      <p class="footer-built">
        Feito com <span class="heart">♥</span> usando AnalogJS
      </p>
    </div>
  </div>
</footer>
