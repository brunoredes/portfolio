<footer class="footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-brand">
        <a href="/" class="footer-logo" aria-label="Bruno Donatelli - Ir para página inicial">
          <span class="logo-text">BRUNO DONATELLI</span>
        </a>
        <p class="footer-tagline">
          Desenvolvedor Full Stack
        </p>
      </div>

      <nav class="footer-nav" aria-label="Navegação do rodapé">
        <h3 class="footer-nav-title">Navegação</h3>
        <ul class="footer-nav-list">
          @for (link of navLinks; track link.id) {
          <li class="footer-nav-item">
            <a [href]="link.href" class="footer-nav-link">
              {{ link.label }}
            </a>
          </li>
          }
        </ul>
      </nav>

      <nav class="footer-social" aria-label="Redes sociais">
        <h3 class="footer-social-title">Redes Sociais</h3>
        <div class="social-links">
          @for (social of socialLinks; track social.id) {
          <a [href]="social.url" [attr.aria-label]="social.label + ' - abrir em nova aba'" class="social-link"
            target="_blank" rel="noopener noreferrer">
            <img [src]="'/assets/icons/' + social.icon + '.svg'" alt="" class="social-icon" width="24" height="24"
              role="presentation" />
          </a>
          }
        </div>
      </nav>
    </div>

    <div class="footer-bottom">
      <p class="footer-copyright">
        © {{ currentYear }} Bruno Donatelli
      </p>
      <p class="footer-built">
        Feito com <span class="heart" aria-hidden="true">♥</span> usando AnalogJS
      </p>
    </div>
  </div>
</footer>
