<section class="tech-stack" id="expertise">
  <div class="container">
    <div class="tech-header">
      <p class="section-label">EXPERTISE</p>
      <h2 class="tech-title">Tecnologias e ferramentas</h2>
    </div>

    <div class="tech-grid">
      @for (tech of techStack; track tech.id; let i = $index) {
      <div class="tech-item" [attr.data-category]="tech.category" [style.animation-delay.s]="i * 0.05">
        <div class="tech-icon-wrapper">
          <img [src]="tech.iconUrl" [alt]="tech.name + ' logo'" class="tech-icon" loading="lazy" width="64"
            height="64" />
        </div>
        <p class="tech-name">{{ tech.name }}</p>
      </div>
      }
    </div>

    <div class="tech-categories">
      <div class="category-badge">
        <span class="category-dot" data-color="frontend"></span>
        <span class="category-label">Frontend</span>
      </div>
      <div class="category-badge">
        <span class="category-dot" data-color="backend"></span>
        <span class="category-label">Backend</span>
      </div>
      <div class="category-badge">
        <span class="category-dot" data-color="devops"></span>
        <span class="category-label">DevOps</span>
      </div>
      <div class="category-badge">
        <span class="category-dot" data-color="database"></span>
        <span class="category-label">Database</span>
      </div>
    </div>
  </div>
</section>
