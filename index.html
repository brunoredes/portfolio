<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <title>Bruno Donatelli - Desenvolvedor Full Stack</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <!-- Fonts - AFTER image preload -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="preload" as="image" type="image/avif" href="/hero/donatelli-400w.avif" imagesrcset="
      /hero/donatelli-400w.avif 400w,
      /hero/donatelli-600w.avif 600w,
      /hero/donatelli-800w.avif 800w
    " imagesizes="
      (max-width: 768px) 300px,
      (max-width: 1024px) 350px,
      400px
    " fetchpriority="high">

  <link rel="stylesheet" href="/src/styles.css" />

  <!-- Load fonts with media print trick for non-blocking -->
  <link
    href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">

  <!-- Material Icons - lazy load -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" rel="stylesheet" media="print"
    onload="this.media='all'">

  <!-- Meta tags -->
  <meta name="description"
    content="Desenvolvedor Full Stack especializado em Angular, Node.js e arquitetura de soluções escaláveis." />
  <meta name="keywords" content="desenvolvedor full stack, angular, nodejs, typescript, web development" />
  <meta name="author" content="Bruno Donatelli" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Donatelli dev Portfolio" />
  <meta property="og:locale" content="pt_BR" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Robots -->
  <meta name="robots" content="index, follow" />
  <meta name="googlebot" content="index, follow" />
</head>

<body>
  <app-root></app-root>
  <script type="module" src="/src/main.ts"></script>

  <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
    <defs>

      <!-- PROTANOPIA: Complete absence of red cones (L-cones) -->
      <!-- Red appears very dark, strong red/green confusion -->
      <filter id="protanopia-filter">
        <feColorMatrix type="matrix" values="
            0.567  0.433  0      0  0
            0.558  0.442  0      0  0
            0      0.242  0.758  0  0
            0      0      0      1  0
          " />
      </filter>

      <!-- PROTANOMALY: Anomalous red cones (L-cones) -->
      <!-- Mild red/green confusion, red less vibrant -->
      <filter id="protanomaly-filter">
        <feColorMatrix type="matrix" values="
            0.817  0.183  0      0  0
            0.333  0.667  0      0  0
            0      0.125  0.875  0  0
            0      0      0      1  0
          " />
      </filter>

      <!-- DEUTERANOPIA: Complete absence of green cones (M-cones) -->
      <!-- Most common severe form, red/green confusion -->
      <filter id="deuteranopia-filter">
        <feColorMatrix type="matrix" values="
            0.625  0.375  0      0  0
            0.70   0.30   0      0  0
            0      0.30   0.70   0  0
            0      0      0      1  0
          " />
      </filter>

      <!-- DEUTERANOMALY: Anomalous green cones (M-cones) -->
      <!-- Most common color vision deficiency (~6% males), mild red/green confusion -->
      <filter id="deuteranomaly-filter">
        <feColorMatrix type="matrix" values="
            0.80   0.20   0      0  0
            0.258  0.742  0      0  0
            0      0.142  0.858  0  0
            0      0      0      1  0
          " />
      </filter>

      <!-- TRITANOPIA: Complete absence of blue cones (S-cones) -->
      <!-- Blue/yellow confusion, very rare -->
      <filter id="tritanopia-filter">
        <feColorMatrix type="matrix" values="
            0.95   0.05   0      0  0
            0      0.433  0.567  0  0
            0      0.475  0.525  0  0
            0      0      0      1  0
          " />
      </filter>

      <!-- TRITANOMALY: Anomalous blue cones (S-cones) -->
      <!-- Mild blue/yellow confusion, extremely rare -->
      <filter id="tritanomaly-filter">
        <feColorMatrix type="matrix" values="
            0.967  0.033  0      0  0
            0      0.733  0.267  0  0
            0      0.183  0.817  0  0
            0      0      0      1  0
          " />
      </filter>

    </defs>
  </svg>
</body>

</html>
