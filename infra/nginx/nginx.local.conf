# ──────────────────────────────────────────────
# Local development — HTTP only, no TLS
# ──────────────────────────────────────────────
worker_processes auto;
worker_rlimit_nofile 8192;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Performance ──────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # ── Logging ──────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ── Brotli (primary) ─────────────────────
    brotli on;
    brotli_comp_level 7;
    brotli_static on;
    brotli_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2;

    # ── Gzip (fallback) ─────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2;

    # ── Prevent absolute redirects with internal hostname ──
    absolute_redirect off;

    # ── HTTP only (local dev) ────────────────
    server {
        listen 8090;
        listen [::]:8090;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ── Security Headers ─────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # ── Health-check ─────────────────────
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # ── robots.txt and Astro sitemap files ──
        # Served directly from /usr/share/nginx/html when present in Astro's output.
        location = /robots.txt {
            access_log off;
            log_not_found off;
        }

        location ~ ^/(?:sitemap-index|sitemap(?:-[0-9]+)?)\.xml$ {
            access_log off;
            log_not_found off;
            try_files $uri =404;
        }

        # ── Deny hidden files (.git, .env, etc.) ──
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # ── Static assets with long cache ────
        location ~* \.(?:css|js|woff2?|eot|ttf|otf|svg|gif|jpe?g|png|webp|avif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # ── SPA fallback ─────────────────────
        location / {
            try_files $uri $uri/index.html /index.html;
        }
    }
}
