# ──────────────────────────────────────────────
# Main context
# ──────────────────────────────────────────────
worker_processes auto;
worker_rlimit_nofile 8192;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Performance ──────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # ── Logging ──────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ── Brotli (primary) ─────────────────────
    brotli on;
    brotli_comp_level 7;
    brotli_static on;
    brotli_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2;

    # ── Gzip (fallback) ─────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2;

    # ── Prevent absolute redirects with internal hostname ──
    absolute_redirect off;

    # ── Redirect HTTP → HTTPS ────────────────
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        # Health-check on HTTP (for load balancers / Docker)
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    # ── HTTPS + QUIC (HTTP/3) ────────────────
    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;

        # QUIC / HTTP3
        listen 8443 quic reuseport;
        listen [::]:8443 quic reuseport;

        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ── TLS ──────────────────────────────
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ── Advertise HTTP/3 ─────────────────
        add_header Alt-Svc 'h3=":8443"; ma=86400' always;

        # ── Security Headers ─────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self';" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;

        # ── SEO Headers ──────────────────────
        add_header X-Robots-Tag "index, follow" always;

        # ── Health-check ─────────────────────
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # ── robots.txt ──────────────────────
        location = /robots.txt {
            access_log off;
            log_not_found off;
        }

        # ── Deny hidden files (.git, .env, etc.) ──
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # ── Static assets with long cache ────
        location ~* \.(?:css|js|woff2?|eot|ttf|otf|svg|gif|jpe?g|png|webp|avif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # ── SPA fallback ─────────────────────
        location / {
            try_files $uri $uri/index.html /index.html;
        }
    }
}
