services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: donatelli-dev
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp/nginx:noexec,nosuid,size=1m,uid=100,gid=101
      - /var/cache/nginx:noexec,nosuid,size=10m,uid=100,gid=101
      - /var/log/nginx:noexec,nosuid,size=5m,uid=100,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:8080"
      - "443:8443/tcp"
      - "443:8443/udp" # QUIC / HTTP3
    volumes:
      # Mount real certs in production (override the baked-in self-signed ones)
      # - /etc/letsencrypt/live/yourdomain.com/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      # - /etc/letsencrypt/live/yourdomain.com/privkey.pem:/etc/nginx/certs/privkey.pem:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
